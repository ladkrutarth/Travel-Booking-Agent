[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "travel-booking-agent"
version = "0.1.0"
description = "Production-shaped travel booking MVP: single LangGraph agent with HITL approval"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
  "email-validator>=2.0.0",
  "httpx>=0.27.0",
  "sqlalchemy>=2.0.36",
  "langgraph>=0.2.0",
  "langchain-core>=0.3.0",
  "langchain-openai>=0.2.0",
  "python-dotenv>=1.0.0",
  "tenacity>=9.0.0",
  "bcrypt>=4.0.0",
  "python-jose[cryptography]>=3.3.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "httpx>=0.27.0",
  "ruff>=0.8.0",
]

[project.scripts]
travel-agent = "travel_agent.api.main:run"

[tool.hatch.build.targets.wheel]
packages = ["src/travel_agent"]

[tool.hatch.build.targets.wheel.force-include]
"src/travel_agent" = "travel_agent"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py39"
